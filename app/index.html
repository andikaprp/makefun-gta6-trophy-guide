<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Legend - GTA VI Trophy Guide and Tracker</title>
<meta name="description" content="Leonida Legend: an original offline GTA VI trophy guide and tracker built on the verified 55-trophy list, with cited guides, a 7-step roadmap and a missable watch.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main class="page">
    <p class="empty-note">Loading the ledger... Leonida Legend reads its trophy data from files inside this folder and then works fully offline.</p>
  </main>
</div>

<dialog id="io-dialog" aria-labelledby="io-title">
  <h2 id="io-title">Export progress</h2>
  <p>Your progress as JSON. Save it, move it to another browser, or paste an earlier export here to import it.</p>
  <textarea id="io-text" spellcheck="false"></textarea>
  <div class="dialog-actions">
    <button type="button" class="btn" id="io-apply">Download / Import</button>
    <button type="button" class="btn" id="io-close">Close</button>
  </div>
</dialog>

<script src="lib/tracker.js"></script>
<script src="lib/views.js"></script>
<script src="app.js"></script>
</body>
</html>
